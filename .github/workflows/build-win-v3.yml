name: Build Windows V3-FINAL

on:
  push:
    branches: [ "feat/windows-build" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          if (Test-Path requirements.txt) { pip install -r requirements.txt }

      - name: Build CLI
        shell: pwsh
        run: |
          pyinstaller --onefile src/open_codex/main.py -n cli

      - name: Build Desktop
        shell: pwsh
        run: |
          pyinstaller --onefile src/open_codex/main.py -n desktop

      - name: Prepare artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "dist_final"
          if (Test-Path "dist/cli.exe") { Copy-Item -Path "dist/cli.exe" -Destination "dist_final/cli.exe" }
          if (Test-Path "dist/desktop.exe") { Copy-Item -Path "dist/desktop.exe" -Destination "dist_final/desktop.exe" }

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-build-v3
          path: dist_final/

      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Build-Windows-Auto-v${{ github.run_number }}
          body: |
            Automated build from GitHub Actions.
            Branch: ${{ github.ref_name }}
            Run Number: ${{ github.run_number }}
          files: |
            dist_final/cli.exe
            dist_final/desktop.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}